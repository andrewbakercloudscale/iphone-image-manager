[project]
name = "iphone-image"
version = "0.0.1"
description = "Open source iPhone image backup, cleanup, organization and safe offload for macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "CloudScale" }]
keywords = [
  "iphone", "photos", "backup", "deduplication", "macos", "cli",
  "google-drive", "screenshots", "whatsapp", "imagecapture",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
media = ["pillow>=10.3", "pillow-heif>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/andrewbakercloudscale/iphone-image-manager"
Issues = "https://github.com/andrewbakercloudscale/iphone-image-manager/issues"

[project.scripts]
iphone-image = "iphone_image.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_image"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly: a default rule set that drifts between ruff versions makes
# CI pass or fail for reasons nobody changed.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PYI", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # conftest puts src on sys.path before importing

[tool.pytest.ini_options]
testpaths = ["tests"]
